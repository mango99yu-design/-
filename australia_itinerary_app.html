    var STORAGE_KEY = 'au_trip_2027_state_v1';
    var memoryStore = {};

    function loadState() {
      var defaults = {
        activeTab: 'overview',
        selectedDay: 1,
        dayFilter: 'all',
        day7Mode: 'planA', // 'planA' (Taronga Zoo + The Rocks) | 'planB' (Blue Mountains Tour)

        checkedPrep: {},
        wishlistFood: {},
        shoppingChecked: {},
        selectedHotelNote: { melbourne: '', sydney: '' },
        dayNotes: {},
        customPrepItems: []
      };
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) {
          return Object.assign({}, defaults, JSON.parse(raw));
        }
      } catch (e) {
        if (memoryStore[STORAGE_KEY]) {
          return Object.assign({}, defaults, memoryStore[STORAGE_KEY]);
        }
      }
      return defaults;
    }

    var state = loadState();

    function saveState() {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMultiline(str) {
      return escapeHtml(str).replace(/\n/g, '<br/>');
    }

    function renderNav() {
      var nav = document.getElementById('main-nav');
      nav.innerHTML = NAV_TABS.map(function (tab) {
        var active = state.activeTab === tab.id;
        var cls = active
          ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent shadow-sm'
          : 'bg-[var(--card)] text-[var(--muted-foreground)] border-[var(--border)] hover:text-[var(--foreground)] hover:border-[var(--primary)]';
        return '<button onclick="switchTab(\'' + tab.id + '\')" class="tab-btn flex items-center gap-1.5 px-3.5 py-2 rounded-xl border text-xs font-medium whitespace-nowrap cursor-pointer ' + cls + '">' +
          getIcon(tab.icon, 'w-3.5 h-3.5') +
          '<span>' + tab.label + '</span>' +
          '</button>';
      }).join('');
    }

    function updateHeaderProgress() {
      var total = 0;
      var done = 0;
      PREP_CHECKLIST.forEach(function (g) {
        g.items.forEach(function (item) {
          total++;
          if (state.checkedPrep[item.id]) done++;
        });
      });
      state.customPrepItems.forEach(function (item) {
        total++;
        if (state.checkedPrep[item.id]) done++;
      });
      var el = document.getElementById('header-checklist-count');
      if (el) el.textContent = done + '/' + total;
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      saveState();
      renderNav();
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToDay(dayNum) {
      state.activeTab = 'itinerary';
      state.selectedDay = dayNum;
      saveState();
      renderNav();
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      renderCurrentTab();

      saveState();

      state.musicalCity = city;
      saveState();
      renderCurrentTab();
    }

      state.foodSubTab = sub;
      saveState();
      renderCurrentTab();
    }

      state.wishlistFood[id] = !state.wishlistFood[id];
      saveState();
      renderCurrentTab();
    }

    function toggleShoppingItem(id) {
      state.shoppingChecked[id] = !state.shoppingChecked[id];
      saveState();
      renderCurrentTab();
    }

    function togglePrepItem(id) {
      state.checkedPrep[id] = !state.checkedPrep[id];
      saveState();
      renderCurrentTab();
    }

    function addCustomPrep(e) {
      e.preventDefault();
      var input = document.getElementById('custom-prep-input');
      var val = (input.value || '').trim();
      if (!val) return;
      state.customPrepItems.push({ id: 'cp_' + Date.now(), text: val });
      input.value = '';
      saveState();
      renderCurrentTab();
    }

    function removeCustomPrep(id) {
      state.customPrepItems = state.customPrepItems.filter(function (i) { return i.id !== id; });
      delete state.checkedPrep[id];
      saveState();
      renderCurrentTab();
    }

    // Export Modal Logic
    function buildSummaryText() {
      var lines = [];
      lines.push('🇦🇺 澳洲九日初遇 · 墨尔本 × 十二门徒 × 悉尼（2027.09.10 - 09.19）');
      lines.push('👭 两位女生轻松游 · 全程仅换 1 次酒店（墨尔本 3 晚 + 悉尼 5 晚）');
      lines.push('');
      lines.push('✈️ 航班汇合：');
      lines.push('• 9/10 重庆(11:45 CZ3466) / 上海(13:30 CZ6752) → 深圳 T3 汇合 → 同飞 CZ3071 (18:55-06:25+1) 抵达悉尼');
      lines.push('• 需另订内陆段：9/11 上午 SYD→MEL (10:30左右)；9/14 下午 MEL→SYD (16:30左右)');
      lines.push('• 9/19 悉尼 10:05 同飞 CZ326 → 广州白云 T2 (18:10) → 各自飞回重庆(20:20)/上海(20:00)');
      lines.push('');
      lines.push('🏨 推荐住宿区域：');
      lines.push('• 墨尔本 (3晚)：Flinders St / Collins St (CBD免费电车区) 或 Southern Cross 东侧');
      if (state.selectedHotelNote.melbourne) lines.push('  ↳ 备选记录：' + state.selectedHotelNote.melbourne);
      lines.push('• 悉尼 (5晚)：Town Hall / QVB / Hyde Park 西侧（购物+机场线无敌）或 Circular Quay');
      if (state.selectedHotelNote.sydney) lines.push('  ↳ 备选记录：' + state.selectedHotelNote.sydney);
      lines.push('');
      lines.push('📅 每日核心安排：');
      DAYS_DATA.forEach(function (d) {
        var extra = d.hasPlanToggle ? (' [' + d[state.day7Mode].label + ']') : '';
        lines.push('Day ' + d.day + ' (' + d.date + ' · ' + d.city + ')：' + d.title + extra);
        if (state.dayNotes[d.day]) lines.push('  📝 备忘：' + state.dayNotes[d.day]);
      });
      lines.push('');
      lines.push('🎭 2027年9月音乐剧必蹲清单（《汉密尔顿》2027暂无澳巡）：');
      lines.push('• 悉尼：《帕丁顿熊音乐剧》澳洲首演 (Capitol Theatre) / 《悲惨世界》40周年全本 (悉尼歌剧院)');
      lines.push('• 墨尔本：《返老还童》9/3-10/2 (Arts Centre) / 《肉馅行动》9月澳洲首演 (Comedy Theatre)');

      var likedFoods = FOOD_DATA.filter(function (f) { return state.wishlistFood[f.id]; });
      if (likedFoods.length > 0) {
        lines.push('');
        lines.push('🍽️ 已收藏想吃清单：');
        likedFoods.forEach(function (f) {
          lines.push('• [' + f.city + '] ' + f.name + '（' + f.dish + '）');
        });
      }
      return lines.join('\n');
    }

    function openSummaryModal() {
      var modal = document.getElementById('summary-modal');
      document.getElementById('summary-textarea').value = buildSummaryText();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeSummaryModal() {
      var modal = document.getElementById('summary-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function copySummaryText() {
      var ta = document.getElementById('summary-textarea');
      ta.select();
      try {
        navigator.clipboard.writeText(ta.value);
      } catch (e) {
        document.execCommand('copy');
      }
      var fb = document.getElementById('copy-feedback');
      fb.style.opacity = '1';
      setTimeout(function () { fb.style.opacity = '0'; }, 2200);
    }

    // Boot
    renderNav();
    updateHeaderProgress();
    renderCurrentTab();
  </script>
</body>
</html>
